# Snyk demo pipeline

trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    displayName: Get Python for Python tools.
    inputs:
      versionSpec: '3.7'
      addToPath: false
    name: pyTools

  - script: $(pyTools.pythonLocation)/bin/pip install
    displayName: Install Python-based tools.

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
      architecture: 'x64'
    displayName: Use cached Python $(python.version) for tests.
  - task: SnykSecurityScan@1
    inputs:
      serviceConnectionEndpoint: 'timsnyk'
      testType: 'app'
      monitorWhen: 'never'
      failOnIssues: true
      projectName: 'python-azure'
      testDirectory: '$(Build.SourcesDirectory)/pip-sample'
