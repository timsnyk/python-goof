# Snyk demo pipeline

trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- task: CmdLine@2
  inputs:
    script: 'pip install -r pip-sample/requirements.txt'
- task: SnykSecurityScan@1
  inputs:
    serviceConnectionEndpoint: 'timsnyk'
    testType: 'app'
    monitorWhen: 'never'
    failOnIssues: true
    projectName: 'python-azure'
    testDirectory: '$(Build.SourcesDirectory)/pip-sample'
